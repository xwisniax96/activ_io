<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="activ_io">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>activ_io</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    #activio-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999; 
    }

    @keyframes pulse-animation {
      0% { transform: scale(0.85); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.85); opacity: 0.9; }
    }

    .pulsing-logo {
      width: 250px;
      height: 250px;
      animation: pulse-animation 1.5s infinite ease-in-out;
    }
  </style>

  <div id="activio-loader">
    <img src="logo.png" class="pulsing-logo" alt="Activ.io ładowanie..." />
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('activio-loader');
      if (loader) {
        // Dodajemy płynne zanikanie (fade-out) dla jeszcze lepszego efektu
        loader.style.transition = 'opacity 0.5s ease-out';
        loader.style.opacity = '0';
        
        // Po pół sekundy całkowicie usuwamy go z przeglądarki, żeby odsłonić mapę
        setTimeout(function() {
          loader.remove();
        }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
